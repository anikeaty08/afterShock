[project]
name = "aftershock"
version = "0.1.0"
description = "See what a docs change breaks before it merges. FalkorDB GraphRAG SDK + answer-ledger impact analysis for docs PRs."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "graphrag-sdk[litellm,markdown]>=1.4.0",
    "falkordb>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "python-frontmatter>=1.1.0",
    "pyjwt[crypto]>=2.9.0",
    "sse-starlette>=2.1.3",
    "mcp>=1.2.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "mcp_server", "eval"]
